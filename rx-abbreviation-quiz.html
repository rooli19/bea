<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEA Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3B2E4A;
    --ink-soft:#7A6B8A;
    --page-1:#FCE7F1;
    --page-2:#E4E7FB;
    --paper:#FFF8FB;
    --paper-line:#F1DCE9;
    --card:#FFFFFF;
    --pink:#F2A6C4;
    --pink-deep:#D9679C;
    --lav:#B7A9EC;
    --lav-deep:#8B77D6;
    --mint:#A9E0C9;
    --mint-deep:#4FAF87;
    --amber-light:#FCE7CF;
    --red:#D9736A;
    --red-light:#FBE3E0;
    --green:#4FAF87;
    --green-light:#DEF3E9;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(160deg, var(--page-1) 0%, var(--page-2) 100%);
    min-height:100vh;
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:40px 16px 60px;
  }
  .app{
    width:100%;
    max-width:760px;
  }
  .brand{
    text-align:center;
    margin-bottom:26px;
  }
  .brand .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:1.5px solid var(--paper-line);
    border-radius:999px;
    padding:10px 22px;
    box-shadow:0 6px 18px rgba(139,119,214,0.15);
  }
  .brand .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--pink-deep);
  }
  .brand .dot.alt{ background:var(--lav-deep); }
  .brand .title{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:22px;
    background:linear-gradient(90deg, var(--pink-deep), var(--lav-deep));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:0.3px;
  }

  .pad{
    background:var(--paper);
    border-radius:22px;
    box-shadow:0 20px 50px rgba(139,119,214,0.22);
    overflow:hidden;
  }
  .pad-inner{
    padding:34px 34px 30px;
  }

  /* ---------- MODE SELECT ---------- */
  .select-screen h1{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:25px;
    margin:6px 0 6px;
    color:var(--lav-deep);
  }
  .select-screen p.lead{
    color:var(--ink-soft);
    font-size:14.5px;
    line-height:1.55;
    margin:0 0 28px;
    max-width:520px;
  }
  .mode-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:600px){ .mode-grid{grid-template-columns:1fr;} }
  .mode-card{
    background:var(--card);
    border:1.5px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 20px;
    cursor:pointer;
    text-align:left;
    transition:border-color .15s ease, transform .1s ease;
    font-family:inherit;
  }
  .mode-card:hover{border-color:var(--pink-deep); transform:translateY(-2px);}
  .mode-card .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--pink-deep);
    display:block;
    margin-bottom:10px;
  }
  .mode-card h3{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 8px;
    color:var(--ink);
  }
  .mode-card p{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0;
  }
  .mode-card .example{
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:var(--page-1);
    border:1px dashed var(--paper-line);
    border-radius:8px;
    padding:8px 10px;
    color:var(--lav-deep);
  }

  /* ---------- QUIZ SCREEN ---------- */
  .quiz-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
    gap:16px;
  }
  .quiz-mode-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--pink-deep);
  }
  .quiz-progress-track{
    height:6px;
    background:var(--paper-line);
    border-radius:4px;
    overflow:hidden;
    margin-top:6px;
    width:200px;
  }
  .quiz-progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--pink-deep), var(--lav-deep));
    transition:width .3s ease;
  }
  .score-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    background:var(--card);
    border:1.5px solid var(--paper-line);
    border-radius:20px;
    padding:6px 14px;
    white-space:nowrap;
  }
  .score-pill b{color:var(--lav-deep);}

  .qnum{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }

  .rx-slip{
    background:var(--card);
    border:1.5px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:22px;
    position:relative;
  }
  .rx-slip .glyph{
    position:absolute;
    top:16px; right:20px;
    font-family:'Fredoka',sans-serif;
    font-size:24px;
    color:var(--paper-line);
    font-weight:700;
  }
  .rx-slip .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .rx-slip .content{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    line-height:1.7;
    color:var(--ink);
    max-width:88%;
  }
  .rx-slip .content.english{
    font-family:'Quicksand',sans-serif;
    font-weight:500;
    font-size:15.5px;
  }

  textarea, input[type=text]{
    width:100%;
    font-family:'IBM Plex Mono',monospace;
    font-size:14.5px;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid var(--paper-line);
    background:var(--card);
    color:var(--ink);
    resize:vertical;
    line-height:1.6;
  }
  textarea:focus, input[type=text]:focus{
    outline:none;
    border-color:var(--lav-deep);
  }

  .field-label{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:8px;
    display:block;
  }

  .keyboard{
    margin-top:18px;
  }
  .kb-group{
    margin-bottom:12px;
  }
  .kb-group .kb-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    margin-bottom:6px;
    display:block;
  }
  .kb-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .kb-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    background:var(--page-1);
    border:1.5px solid var(--paper-line);
    color:var(--lav-deep);
    padding:6px 11px;
    border-radius:9px;
    cursor:pointer;
    transition:background .12s ease, transform .08s ease;
  }
  .kb-btn:hover{ background:var(--pink); border-color:var(--pink-deep); color:#5C2748; }
  .kb-btn:active{ transform:scale(0.94); }

  .actions{
    margin-top:22px;
    display:flex;
    gap:12px;
  }
  .btn{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:12px 22px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    transition:transform .08s ease, opacity .12s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background:linear-gradient(90deg, var(--pink-deep), var(--lav-deep));
    color:#fff;
  }
  .btn-primary:hover{ opacity:0.92; }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-ghost{
    background:transparent;
    border:1.5px solid var(--paper-line);
    color:var(--ink-soft);
  }
  .btn-ghost:hover{ border-color:var(--lav-deep); color:var(--lav-deep); }

  .feedback{
    margin-top:22px;
    border-radius:var(--radius);
    padding:20px 22px;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct{ background:var(--green-light); border:1.5px solid #BFE4D2; }
  .feedback.incorrect{ background:var(--red-light); border:1.5px solid #F1C4BE; }
  .feedback .verdict{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:18px;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
  }
  .feedback.correct .verdict{ color:var(--green); }
  .feedback.incorrect .verdict{ color:var(--red); }
  .feedback .correct-answer{
    margin-top:12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    line-height:1.6;
    background:rgba(255,255,255,0.65);
    border-radius:10px;
    padding:12px 14px;
    color:var(--ink);
  }
  .feedback .correct-answer .ca-label{
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    display:block;
    margin-bottom:6px;
  }
  .feedback .note{
    margin-top:10px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  /* ---------- RESULTS ---------- */
  .results h1{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:27px;
    margin:4px 0 6px;
    color:var(--lav-deep);
  }
  .results .score-big{
    font-family:'IBM Plex Mono',monospace;
    font-size:52px;
    font-weight:600;
    color:var(--pink-deep);
    margin:18px 0 4px;
  }
  .results .score-caption{
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:26px;
  }
  .results .btn{ margin-right:10px; }

  .back-link{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    cursor:pointer;
    padding:0;
    margin-bottom:14px;
    display:inline-block;
  }
  .back-link:hover{ color:var(--lav-deep); }

  .sr-only{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  ::selection{ background:var(--pink); }
</style>
</head>

</div>

const KEYBOARD_GROUPS = [
  { label: "Route", keys: ["PO","PR","IM","IV","IVPB","SC","SQ","vag"] },
  { label: "Eye", keys: ["OD","OS","OU"] },
  { label: "Form", keys: ["tab","cap","supp","susp","elix","gtt","Tr"] },
  { label: "Amount", keys: ["mg","g","mEq","gr","mL","units","i","ii","iii","iv","v","ss","no.","#"] },
  { label: "Timing", keys: ["ac","pc","hs","qam","q4h","q6h","q8h","q12h","q4-6h","bid","tid","qid","daily","qod"] },
  { label: "As needed / stop", keys: ["prn","sos","stat","non rep","rept","qs"] },
  { label: "Symbols", keys: ["ā","p̄","c̄","s̄","Sig","Rx","agit","disp","D5W","dil"] }
];

/* ---------------- STATE ---------------- */
let state = {
  screen: "select", // select | quiz | results
  mode: null,        // "rx2eng" | "eng2rx"
  order: [],
  index: 0,
  score: 0,
  answered: false,
  lastCorrect: false
};

function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function startQuiz(mode){
  const bank = mode === "rx2eng" ? RX_TO_ENGLISH : ENGLISH_TO_RX;
  state = {
    screen:"quiz",
    mode,
    order: shuffledIndices(bank.length),
    index:0,
    score:0,
    answered:false,
    lastCorrect:false
  };
  render();
}

function normalize(str){
  return str.toLowerCase()
    .replace(/[.,;:#\/\\]/g," ")
    .replace(/[āàá]/g,"a")
    .replace(/[p̄]/g,"p")
    .replace(/[c̄]/g,"c")
    .replace(/[s̄]/g,"s")
    .replace(/\s+/g," ")
    .trim();
}

function checkRx2Eng(item, userInput){
  const norm = " " + normalize(userInput) + " ";
  let matched = 0;
  for(const group of item.keyGroups){
    if(group.some(term => norm.includes(" "+normalize(term)+" ") || norm.includes(normalize(term)))){
      matched++;
    }
  }
  const ratio = matched / item.keyGroups.length;
  return ratio >= 0.75;
}

function checkEng2Rx(item, userInput){
  const norm = normalize(userInput);
  let matched = 0;
  for(const token of item.required){
    if(norm.includes(normalize(token))) matched++;
  }
  return matched >= item.required.length;
}

function submitAnswer(){
  const bank = state.mode === "rx2eng" ? RX_TO_ENGLISH : ENGLISH_TO_RX;
  const item = bank[state.order[state.index]];
  const inputEl = document.getElementById("answer-input");
  const userInput = inputEl.value;
  let correct;
  if(state.mode === "rx2eng"){
    correct = checkRx2Eng(item, userInput);
  } else {
    correct = checkEng2Rx(item, userInput);
  }
  state.answered = true;
  state.lastCorrect = correct;
  if(correct) state.score++;
  render();
}

function nextQuestion(){
  const bank = state.mode === "rx2eng" ? RX_TO_ENGLISH : ENGLISH_TO_RX;
  if(state.index + 1 >= bank.length){
    state.screen = "results";
  } else {
    state.index++;
    state.answered = false;
    state.lastCorrect = false;
  }
  render();
}

function insertKey(key){
  const inputEl = document.getElementById("answer-input");
  if(!inputEl) return;
  const start = inputEl.selectionStart ?? inputEl.value.length;
  const end = inputEl.selectionEnd ?? inputEl.value.length;
  const before = inputEl.value.slice(0,start);
  const after = inputEl.value.slice(end);
  const needsSpaceBefore = before.length && !/\s$/.test(before);
  const insertion = (needsSpaceBefore ? " " : "") + key + " ";
  inputEl.value = before + insertion + after;
  const pos = (before + insertion).length;
  inputEl.focus();
  inputEl.setSelectionRange(pos,pos);
}

function goHome(){
  state = { screen:"select", mode:null, order:[], index:0, score:0, answered:false, lastCorrect:false };
  render();
}

function retrySameMode(){
  startQuiz(state.mode);
}

/* ---------------- RENDER ---------------- */
function escapeHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function render(){
  const root = document.getElementById("app-root");
  if(state.screen === "select"){
    root.innerHTML = renderSelect();
    attachSelectHandlers();
  } else if(state.screen === "quiz"){
    root.innerHTML = renderQuiz();
    attachQuizHandlers();
  } else {
    root.innerHTML = renderResults();
    attachResultsHandlers();
  }
}

function renderSelect(){
  return `
    <div class="select-screen">
      <h1>Choose a drill</h1>
      <p class="lead">30 questions per mode, built only from the standard prescription abbreviation table. Each question combines dosage, route, frequency, PRN conditions, and maximum-dose or hold instructions.</p>
      <div class="mode-grid">
        <button class="mode-card" data-mode="rx2eng">
          <span class="tag">Mode 1</span>
          <h3>Translate prescriptions</h3>
          <p>Read a shorthand prescription and type its meaning in plain English.</p>
          <div class="example">Cap 500 mg. Sig: i cap PO tid ac and hs prn pain&hellip;</div>
        </button>
        <button class="mode-card" data-mode="eng2rx">
          <span class="tag">Mode 2</span>
          <h3>Translate to prescriptions</h3>
          <p>Read a plain-English instruction and write it using standard abbreviations.</p>
          <div class="example">Give 10 units subcutaneously every morning&hellip;</div>
        </button>
      </div>
    </div>
  `;
}

function attachSelectHandlers(){
  document.querySelectorAll(".mode-card").forEach(btn=>{
    btn.addEventListener("click", ()=> startQuiz(btn.dataset.mode));
  });
}

function renderQuiz(){
  const bank = state.mode === "rx2eng" ? RX_TO_ENGLISH : ENGLISH_TO_RX;
  const item = bank[state.order[state.index]];
  const total = bank.length;
  const pct = Math.round(((state.index) / total) * 100);
  const modeLabel = state.mode === "rx2eng" ? "Mode 1 &middot; Prescription &rarr; English" : "Mode 2 &middot; English &rarr; Prescription";

  const promptBlock = state.mode === "rx2eng"
    ? `<div class="rx-slip">
         <div class="label">Prescription</div>
         <div class="content">${escapeHtml(item.rx).replace(/\n/g,"<br>")}</div>
       </div>`
    : `<div class="rx-slip">
         <div class="label">Physician's instruction</div>
         <div class="content english">${escapeHtml(item.english)}</div>
       </div>`;

  const inputBlock = state.mode === "rx2eng"
    ? `<span class="field-label">Write the plain-English meaning</span>
       <textarea id="answer-input" rows="4" placeholder="Take one capsule by mouth..." ${state.answered ? "disabled" : ""}></textarea>`
    : `<span class="field-label">Write the prescription using standard abbreviations</span>
       <textarea id="answer-input" rows="3" placeholder="Sig: ..." ${state.answered ? "disabled" : ""}></textarea>
       <div class="keyboard">
         ${KEYBOARD_GROUPS.map(g => `
           <div class="kb-group">
             <span class="kb-label">${g.label}</span>
             <div class="kb-row">
               ${g.keys.map(k => `<button type="button" class="kb-btn" data-key="${escapeHtml(k)}" ${state.answered ? "disabled" : ""}>${escapeHtml(k)}</button>`).join("")}
             </div>
           </div>
         `).join("")}
       </div>`;

  const feedbackBlock = state.answered ? `
    <div class="feedback show ${state.lastCorrect ? "correct" : "incorrect"}">
      <div class="verdict">${state.lastCorrect ? "Correct" : "Incorrect"}</div>
      ${state.lastCorrect
        ? `<div class="note">Nice work, that covers the key elements of this order.</div>`
        : `<div class="correct-answer"><span class="ca-label">Reference answer</span>${escapeHtml(item.answer)}</div>`
      }
    </div>
  ` : `<div class="feedback"></div>`;

  const actionsBlock = state.answered
    ? `<div class="actions"><button class="btn btn-primary" id="next-btn">Next question</button></div>`
    : `<div class="actions"><button class="btn btn-primary" id="submit-btn">Submit answer</button></div>`;

  return `
    <button class="back-link" id="home-link">&larr; change mode</button>
    <div class="quiz-top">
      <div>
        <div class="quiz-mode-label">${modeLabel}</div>
        <div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="score-pill">Score <b>${state.score}</b> / ${total}</div>
    </div>
    <div class="qnum">Question ${state.index+1} of ${total}</div>
    ${promptBlock}
    ${inputBlock}
    ${feedbackBlock}
    ${actionsBlock}
  `;
}

function attachQuizHandlers(){
  const homeLink = document.getElementById("home-link");
  if(homeLink) homeLink.addEventListener("click", goHome);

  document.querySelectorAll(".kb-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> insertKey(btn.dataset.key));
  });

  const submitBtn = document.getElementById("submit-btn");
  if(submitBtn) submitBtn.addEventListener("click", submitAnswer);

  const nextBtn = document.getElementById("next-btn");
  if(nextBtn) nextBtn.addEventListener("click", nextQuestion);

  const inputEl = document.getElementById("answer-input");
  if(inputEl){
    inputEl.focus();
    inputEl.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){
        e.preventDefault();
        if(!state.answered) submitAnswer();
      }
    });
  }
}

function renderResults(){
  const bank = state.mode === "rx2eng" ? RX_TO_ENGLISH : ENGLISH_TO_RX;
  const total = bank.length;
  const pct = Math.round((state.score/total)*100);
  let remark;
  if(pct >= 90) remark = "Excellent command of the abbreviations.";
  else if(pct >= 70) remark = "Solid grasp, review the missed items.";
  else if(pct >= 50) remark = "Getting there, worth another pass.";
  else remark = "Revisit the abbreviation table before trying again.";

  return `
    <button class="back-link" id="home-link">&larr; change mode</button>
    <div class="results">
      <h1>Drill complete</h1>
      <div class="score-big">${state.score} / ${total}</div>
      <div class="score-caption">${pct}% &middot; ${remark}</div>
      <button class="btn btn-primary" id="retry-btn">Try again</button>
      <button class="btn btn-ghost" id="switch-btn">Switch mode</button>
    </div>
  `;
}

function attachResultsHandlers(){
  document.getElementById("home-link").addEventListener("click", goHome);
  document.getElementById("retry-btn").addEventListener("click", retrySameMode);
  document.getElementById("switch-btn").addEventListener("click", goHome);
}

render();
</script>
