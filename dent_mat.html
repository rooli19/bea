<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💗 dent mat flashcards</title>
    <style>
      :root {
        --pink-1: #ffe4ef;
        --pink-2: #ffc2d9;
        --pink-3: #ff9dc4;
        --pink-4: #ff6fa8;
        --pink-deep: #e84393;
        --purple: #c9a7ff;
        --mint: #9be8c9;
        --red: #ff8a8a;
        --text-dark: #5a3550;
        --white: #fffafd;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Trebuchet MS", sans-serif;
        background: radial-gradient(
          circle at 20% 20%,
          #ffe9f3,
          #ffd6e8 40%,
          #ffc3dc 100%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        color: var(--text-dark);
        overflow-x: hidden;
        padding-bottom: 40px;
      }

      .back-btn {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10;
        text-decoration: none;
        color: var(--pink-deep);
      }
      .back-btn:hover {
        transform: translateY(-1px);
      }

      .bg-heart {
        position: fixed;
        top: -40px;
        font-size: 22px;
        opacity: 0.35;
        animation: floatDown linear infinite;
        pointer-events: none;
        z-index: 0;
        user-select: none;
      }
      @keyframes floatDown {
        0% {
          transform: translateY(-10vh) rotate(0deg);
        }
        100% {
          transform: translateY(110vh) rotate(360deg);
        }
      }

      header {
        width: 100%;
        text-align: center;
        padding: 22px 10px 10px;
        z-index: 2;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        color: var(--pink-deep);
        text-shadow: 1px 1px 0 #fff;
        letter-spacing: 0.5px;
      }
      .subtitle {
        color: #a86392;
        font-size: 0.95rem;
        margin-top: 4px;
      }

      .topbar {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        margin-top: 10px;
        z-index: 2;
      }
      .icon-btn {
        background: var(--white);
        border: 2px solid var(--pink-3);
        border-radius: 50%;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        cursor: pointer;
        box-shadow: 0 3px 0 var(--pink-3);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }
      .icon-btn:active {
        transform: translateY(3px);
        box-shadow: 0 0 0 var(--pink-3);
      }

      .score-board {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin: 18px 10px 6px;
        z-index: 2;
      }
      .score-pill {
        background: var(--white);
        border-radius: 20px;
        padding: 8px 16px;
        box-shadow: 0 3px 8px rgba(255, 111, 168, 0.25);
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 2px solid var(--pink-2);
      }
      .score-pill.correct {
        color: #2ea86b;
        border-color: #b7f0d3;
      }
      .score-pill.incorrect {
        color: #e85a5a;
        border-color: #ffd0d0;
      }
      .score-pill.progress {
        color: var(--pink-deep);
      }
      .score-pill.percent {
        color: #a06be0;
        border-color: #e4d4ff;
      }

      .progress-bar-wrap {
        width: min(560px, 90vw);
        height: 14px;
        background: #ffe0ee;
        border-radius: 10px;
        overflow: hidden;
        margin: 8px auto 0;
        border: 2px solid var(--pink-2);
        z-index: 2;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--pink-3), var(--pink-deep));
        transition: width 0.4s ease;
        border-radius: 10px 0 0 10px;
      }

      .stage {
        perspective: 1600px;
        width: min(560px, 92vw);
        height: 340px;
        margin: 28px auto 10px;
        z-index: 2;
      }
      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1.15);
        cursor: pointer;
      }
      .card.flipped {
        transform: rotateY(180deg);
      }
      .card.shake {
        animation: shakeAnim 0.5s ease;
      }
      @keyframes shakeAnim {
        0%,
        100% {
          transform: translateX(0) rotateY(var(--rot, 0deg));
        }
        20% {
          transform: translateX(-10px) rotateY(var(--rot, 0deg));
        }
        40% {
          transform: translateX(10px) rotateY(var(--rot, 0deg));
        }
        60% {
          transform: translateX(-8px) rotateY(var(--rot, 0deg));
        }
        80% {
          transform: translateX(8px) rotateY(var(--rot, 0deg));
        }
      }
      .card.pop {
        animation: popAnim 0.5s ease;
      }
      @keyframes popAnim {
        0% {
          transform: scale(1) rotateY(var(--rot, 0deg));
        }
        30% {
          transform: scale(1.05) rotateY(var(--rot, 0deg));
        }
        100% {
          transform: scale(1) rotateY(var(--rot, 0deg));
        }
      }

      .face {
        position: absolute;
        inset: 0;
        border-radius: 26px;
        backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 26px;
        text-align: center;
        box-shadow:
          0 12px 30px rgba(232, 67, 147, 0.25),
          inset 0 0 0 3px #fff;
      }
      .front {
        background: linear-gradient(160deg, #fff0f7, #ffd7e9);
      }
      .back {
        background: linear-gradient(160deg, #fff5fb, #ffe0ef);
        transform: rotateY(180deg);
      }
      .card-label {
        position: absolute;
        top: 16px;
        left: 20px;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--pink-deep);
        background: #fff;
        padding: 3px 10px;
        border-radius: 12px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      }
      .card-num {
        position: absolute;
        top: 16px;
        right: 20px;
        font-size: 0.75rem;
        color: #a86392;
        font-weight: 600;
      }
      .q-text,
      .a-text {
        font-size: 1.15rem;
        font-weight: 600;
        line-height: 1.5;
        max-height: 210px;
        overflow-y: auto;
        padding: 4px 6px;
      }
      .a-text {
        color: #c2277d;
      }
      .explain-text {
        margin-top: 12px;
        font-size: 0.85rem;
        color: #8a5878;
        font-weight: 400;
        max-height: 80px;
        overflow-y: auto;
      }
      .hint {
        margin-top: 14px;
        font-size: 0.75rem;
        color: #c98cae;
        font-style: italic;
      }

      .assess-row {
        display: flex;
        gap: 16px;
        margin-top: 18px;
        z-index: 2;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .assess-row.show {
        opacity: 1;
        pointer-events: auto;
      }
      .assess-btn {
        border: none;
        border-radius: 18px;
        padding: 14px 28px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        color: #fff;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.12);
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .assess-btn:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12);
      }
      .btn-correct {
        background: linear-gradient(160deg, #8ee6b6, #3fbf82);
      }
      .btn-incorrect {
        background: linear-gradient(160deg, #ff9d9d, #ef5f5f);
      }

      .nav-row {
        display: flex;
        gap: 14px;
        margin-top: 10px;
        z-index: 2;
      }
      .nav-btn {
        background: var(--white);
        border: 2px solid var(--pink-3);
        color: var(--pink-deep);
        border-radius: 16px;
        padding: 9px 18px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 3px 0 var(--pink-3);
        transition: transform 0.1s ease;
      }
      .nav-btn:active {
        transform: translateY(3px);
      }
      .nav-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .tap-hint {
        margin-top: 6px;
        font-size: 0.8rem;
        color: #b06090;
        z-index: 2;
      }

      .results {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        background: var(--white);
        border-radius: 28px;
        padding: 40px 30px;
        margin: 30px auto;
        width: min(500px, 90vw);
        box-shadow: 0 15px 40px rgba(232, 67, 147, 0.3);
        z-index: 2;
        animation: popAnim 0.6s ease;
      }
      .results h2 {
        color: var(--pink-deep);
        font-size: 1.8rem;
        margin-bottom: 4px;
      }
      .results .big-score {
        font-size: 3.2rem;
        font-weight: 800;
        color: var(--pink-4);
        margin: 10px 0;
      }
      .results .msg {
        font-size: 1.05rem;
        color: #8a5878;
        margin-bottom: 20px;
      }
      .results .stat-row {
        display: flex;
        gap: 14px;
        margin-bottom: 22px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .restart-btn {
        background: linear-gradient(160deg, var(--pink-3), var(--pink-deep));
        color: #fff;
        border: none;
        padding: 16px 34px;
        border-radius: 20px;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 5px 0 #c2277d;
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
      }
      .restart-btn:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #c2277d;
      }

      .particle {
        position: fixed;
        pointer-events: none;
        z-index: 999;
        top: 0;
        left: 0;
        font-size: 22px;
        will-change: transform, opacity;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--pink-3);
        border-radius: 6px;
      }

      footer {
        margin-top: 20px;
        font-size: 0.75rem;
        color: #c98cae;
        z-index: 2;
      }

      @media (max-width: 480px) {
        .stage {
          height: 380px;
        }
        h1 {
          font-size: 1.5rem;
        }
        .assess-btn {
          padding: 12px 20px;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <a
      href="index.html"
      class="icon-btn back-btn"
      title="Back to home"
      aria-label="Back to home"
      >←</a
    >

    <header>
      <h1>💗 Dent Matz</h1>
      <div class="subtitle">u got this beb!</div>
    </header>

    <div class="topbar">
      <button class="icon-btn" id="soundToggle" title="Mute/Unmute sounds">
        🔊
      </button>
      <button class="icon-btn" id="shuffleBtn" title="Shuffle deck">🔀</button>
    </div>

    <div class="score-board">
      <div class="score-pill correct">✅ <span id="correctCount">0</span></div>
      <div class="score-pill incorrect">
        ❌ <span id="incorrectCount">0</span>
      </div>
      <div class="score-pill progress">
        📍 <span id="progressCount">1/150</span>
      </div>
      <div class="score-pill percent">🌸 <span id="percentScore">0%</span></div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>

    <div class="stage" id="stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="card-label">QUESTION</div>
          <div class="card-num" id="cardNumFront"></div>
          <div class="q-text" id="questionText"></div>
          <div class="hint">tap to reveal answer 🌷</div>
        </div>
        <div class="face back">
          <div class="card-label">ANSWER</div>
          <div class="card-num" id="cardNumBack"></div>
          <div class="a-text" id="answerText"></div>
          <div class="explain-text" id="explainText"></div>
        </div>
      </div>
    </div>

    <div class="tap-hint" id="tapHint">👆 Tap the card to flip</div>

    <div class="assess-row" id="assessRow">
      <button class="assess-btn btn-correct" id="btnCorrect">✅ Correct</button>
      <button class="assess-btn btn-incorrect" id="btnIncorrect">
        ❌ Incorrect
      </button>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">⬅ Prev</button>
      <button class="nav-btn" id="skipBtn">Skip ➡</button>
    </div>

    <div class="results" id="results">
      <h2>🎉 Deck Complete! 🎉</h2>
      <div class="big-score" id="finalPercent">0%</div>
      <div class="msg" id="finalMsg"></div>
      <div class="stat-row">
        <div class="score-pill correct">
          ✅ <span id="finalCorrect">0</span> Correct
        </div>
        <div class="score-pill incorrect">
          ❌ <span id="finalIncorrect">0</span> Incorrect
        </div>
      </div>
      <button class="restart-btn" id="restartBtn">🔁 Restart Deck</button>
    </div>

    <footer>
      Made with 💕 for reviewing Dental Materials — Impression Materials
    </footer>

    <script>
      const cards = [
        {
          q: "What is the definition of Impression?",
          a: "Negative reproduction",
          e: "Impression = negative reproduction; Cast = positive reproduction.",
        },
        {
          q: "What is the objective of impression materials?",
          a: "To copy accurately the teeth and other structures in the oral cavity",
          e: "Objective: to copy accurately the teeth and other structures in the oral cavity.",
        },
        {
          q: "What setting mechanism describes an irreversible reaction implying that chemical reaction have occurred and that the material can't revert to its present state?",
          a: "Thermo set",
          e: "Thermo set – irreversible reaction implies that chemical reaction have occurred and that the material can't revert to its present state. Ex: alginate, zinc oxide eugenol impression paste.",
        },
        {
          q: "What are examples of Thermoplastic materials?",
          a: "Reversible hydrocolloid and the impression compound",
          e: "Thermoplastic – reversible materials softened under heat and solidify when they are cooled, with no chemical change taking place.",
        },
        {
          q: "What is the definition of Impression Trays?",
          a: "Appliance used to reach the patient's mouth",
          e: "Impression Trays – appliance used to reach the patient's mouth.",
        },
        {
          q: "Which tray is used for modelling compound for preliminary impression, has no perforations, and has good adhesive property?",
          a: "Stock tray",
          e: "Stock tray – used for modelling compound for preliminary impression; no perforations; Good adhesive property.",
        },
        {
          q: "Which tray is used when impression materials do not adhere to the tray, with perforations?",
          a: "Perforated tray",
          e: "Perforated tray – used when impression materials do not adhere to the tray; with perforations.",
        },
        {
          q: "Which tray has a locking mechanism and no perforations?",
          a: "Rim-lock tray",
          e: "Rim-lock tray – there's a locking mechanism; no perforations.",
        },
        {
          q: "Which tray is custom-built, self-made, and used in final impression for study cast?",
          a: "Individual tray",
          e: "Individual tray – custom-built; self-made; used in final impression for study cast (Resin, Shellac base plate, Type II modelling compound).",
        },
        {
          q: "Which tray is used for agar impression?",
          a: "Water-cooled tray",
          e: "Water-cooled tray – used for agar impression.",
        },
        {
          q: "Which tray is made of plastic?",
          a: "Disposable tray",
          e: "Disposable tray – made of plastic.",
        },
        {
          q: 'What type of impression is described as preliminary impression; final impression/secondary; "wash"; more accurate; corrects the defect of preliminary impression?',
          a: "Double impression",
          e: 'Double impression – preliminary impression; final impression/secondary; "wash"; more accurate; corrects the defect of preliminary impression.',
        },
        {
          q: "According to physical properties, under Rigid/Inelastic (edentulous patient) and Thermoset (irreversible), what materials are listed?",
          a: "Plaster of Paris and ZOE paste",
          e: "Thermoset (irreversible) - Rigid/Inelastic: Plaster of Paris, ZOE paste. Elastic: Alginate, Rubber impression material (Polysulfide, Polyether, Condensation silicone, Addition silicone).",
        },
        {
          q: "Under Thermoplastic (reversible), what is listed for Rigid/Inelastic and Elastic categories respectively?",
          a: "Modelling compound and Agar",
          e: "Thermoplastic (reversible) - Rigid/Inelastic: Modelling compound. Elastic: Agar.",
        },
        {
          q: "What is the manner of withdrawal for Rigid/Inelastic (edentulous patient) materials?",
          a: "Teasing movement",
          e: "Manner of Withdrawal - Rigid/Inelastic: Teasing movement.",
        },
        {
          q: "What is the manner of withdrawal for Elastic (dentate patient) materials?",
          a: "Sudden pull parallel to the long axis of the tooth",
          e: "Manner of Withdrawal - Elastic: Sudden pull parallel to the long axis of the tooth.",
        },
        {
          q: "What is the composition of Soluble Plaster?",
          a: "80% plaster of paris (β-hemihydrate)",
          e: "Composition: 80% plaster of paris (β-hemihydrate).",
        },
        {
          q: "In Soluble Plaster, what is the function of KSO4?",
          a: "Accelerator; speed up setting time (3-5 mins)",
          e: "KSO4 – accelerator; speed up setting time (3-5 mins).",
        },
        {
          q: "In Soluble Plaster, what is the function of Potato starch?",
          a: "Makes the plaster soluble; help in separating cast and impression material when submerged in hot water (soluble plaster swells when placed in hot water)",
          e: "Potato starch – makes the plaster soluble; help in separating cast and impression material when submerged in hot water.",
        },
        {
          q: "What is the function of Coloring materials in Soluble Plaster?",
          a: "Help in interpreting the impression; provides ease in reading the impression; for easy identification of impression from cast",
          e: "Coloring materials – help in interpreting the impression; provides ease in reading the impression; for easy identification of impression from cast.",
        },
        {
          q: "What is Soluble Plaster's use, according to the Properties table?",
          a: "For taking secondary impression",
          e: "Use: For taking secondary impression.",
        },
        {
          q: "What is the WP ratio of Soluble Plaster?",
          a: "0.50-0.75",
          e: "WP ratio: 0.50-0.75.",
        },
        {
          q: "What is the compressive strength of Soluble Plaster?",
          a: "580 +/-290 psi",
          e: "Compressive strength: 580 +/-290 psi; Easy to break; Not popular in the market anymore.",
        },
        {
          q: "What is the manner of withdrawal for Soluble Plaster?",
          a: "Teasing movement",
          e: "Manner of withdrawal: Teasing movement.",
        },
        {
          q: "In the Boxing Method of cast construction, how wide is the wax strip placed around the tray?",
          a: "1 inch",
          e: 'Boxing Method: Place a 1" wax strip around the tray. Pour cast material on tray and level it to the wax. Let it set. Remove the wax and separate the cast after setting.',
        },
        {
          q: "In the Inversion Method, after pouring cast material on the tray, what is done with the excess?",
          a: "Poured on a glass slab or on the tiled working table, then the impression tray is inverted on slab or table and the flowing cast is scraped",
          e: "Inversion Method: Pour cast material on tray. Pour the excess on a glass slab or on the tiled working table. Invert the impression tray on slab or table. Scrape flowing cast.",
        },
        {
          q: "In the Rubber Base Former method, what do you invert the tray on, instead of a slab or table?",
          a: "A rubber base former",
          e: "Rubber Base Former: Instead of inverting on a slab or table, invert on a rubber base former.",
        },
        {
          q: "What are the Properties of Good Cast?",
          a: "No porosities/nodules; No distortion: copy accordingly the given impression; Dimensionally stable",
          e: "Properties of Good Cast: No porosities/nodules; No distortion: copy accordingly the given impression; Dimensionally stable.",
        },
        {
          q: '"Modelling compound" is supplied in what form, and is it for edentulous or dentate ridges?',
          a: "Supplied in the form of sheets and sticks; for edentulous ridges",
          e: '"Modelling compound" is supplied in the form of sheets and sticks. It is softened by heat, inserted in an impression tray, place against tissue. It is for edentulous ridges.',
        },
        {
          q: "What type of Modelling Compound is described as: True impression compound, has high flow property, for preliminary impression?",
          a: "Type I",
          e: "Type I: True impression compound; Has high flow property; For preliminary impression.",
        },
        {
          q: "What type of Modelling Compound is the tray compound, more rigid, for individual tray?",
          a: "Type II",
          e: "Type II: Tray compound; More rigid; for individual tray.",
        },
        {
          q: "In the Components of Modelling Compound, what are Beeswax and thermoplastic resin responsible for?",
          a: "For thermoplastic property",
          e: "Beeswax and thermoplastic resin: For thermoplastic property.",
        },
        {
          q: "In the Components of Modelling Compound, Shellac, gutta percha, and stearic acid are responsible for what?",
          a: "Can improve workability, act as plasticizer/hardening agent",
          e: "Shellac, gutta percha, stearic acid: Can improve workability, act as plasticizer/hardening agent.",
        },
        {
          q: "In the Components of Modelling Compound, French chalk, talc, and diatomaceous earth fillers are responsible for what?",
          a: "Hardeners; for strength",
          e: "French chalk, talc, diatomaceous earth fillers: Hardeners; for strength.",
        },
        {
          q: "What type of Modelling Compound (by dispensing form) is used for full arch impression (preliminary)?",
          a: "Cake",
          e: "Cake – for full arch impression (preliminary).",
        },
        {
          q: 'What type of Modelling Compound is used for single tooth, called "impression tube" with the use of copper band (matrix band)?',
          a: "Stick",
          e: 'Stick – for single tooth; "impression tube" with the use of copper band (matrix band).',
        },
        {
          q: "What are the Uses of Modelling Compound?",
          a: "For impression taking (preliminary); Individual tray construction (stick); For border molds (makes the rim higher; stick); Serve as a wedge material to hold the matrix in place",
          e: "Uses: For impression taking (preliminary); Individual tray construction (stick); For border molds (makes the rim higher; stick); Serve as a wedge material to hold the matrix in place.",
        },
        {
          q: "In the Moist heat method of manipulating Modelling Compound, at what temperature is the water bath?",
          a: "50-70°C",
          e: "Moist heat method: Water bath 50-70°C. Because of poor thermal conductivity/poor heat transfer, the outer surface softens while the inner surface remains hard. Homogenously soft in and out.",
        },
        {
          q: "What is the Dry heat method for Modelling Compound?",
          a: "Open flame",
          e: "Dry heat method: Open flame.",
        },
        {

          e: "Addition Silicone: Polyvinylsiloxane / vinyl polysiloxane. Least affected by pouring delay of any material.",

          a: "Putty-wash, wash-wash",
          e: "Comes in many varieties (putty-wash, wash-wash).",
        },

          a: "Surfactants has been added; dies are 14-33% softer",
          e: "Surfactants has been added to decrease its hydrophobia; dies are 14-33% softer. Elasticity: 97.9%. More expensive than condensation silicone.",

        {

          a: "Silicone polymer",

          a: "Divinyl polymethyl siloxane; Activator – platinum salt; Fillers",
          e: "Catalyst (Addition Silicone): Divinyl polymethyl siloxane; Activator – platinum salt; Fillers.",

          a: "Aluminium sulfate",
          e: "Retarder (Addition Silicone Base): Aluminium sulfate.",

          a: "More flexible; has a higher tear strength... rubber; more dimensionally stable",
          e: "Advantages over hydrocolloids: More flexible; Has a higher tear strength.... rubber; More dimensionally stable.",
        },
        {

          a: "0.05-0.36%; Loss of volatile compounds, Thermal changes, polymerization shrinkage",
          e: "Properties: Shrinkage occurs at a rate of 0.05-0.36%: Loss of volatile compounds; Thermal changes; polymerization shrinkage.",
        },
        {
          q: "What is the elasticity percentage of Condensation Silicone (CS), Polyether (PE), Polysulfide (PS), and Addition Silicone (AS)?",
          a: "CS: 99.5%; PE: 98.9%; PS: 97.9%; AS: 97.9%",
          e: "Elasticity: CS: 99.5%; PE: 98.9%; PS: 97.9%; AS: 97.9%.",
        },
        {
          q: "What is the tear strength of rubber impression materials?",
          a: "25-35psi",
          e: "Tear strength of 25-35psi.",
        },
      ];

      let deck = [...cards.keys()];
      let pos = 0;
      let correctCount = 0;
      let incorrectCount = 0;
      let answeredThisCard = false;
      let soundOn = true;

      let actx;
      function ensureAudio() {
        if (!actx) {
          actx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      function tone(freq, dur, type = "sine", vol = 0.18, delay = 0) {
        if (!soundOn) return;
        ensureAudio();
        const t0 = actx.currentTime + delay;
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(vol, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        osc.connect(gain).connect(actx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      }
      function sfxFlip() {
        tone(520, 0.12, "triangle", 0.15);
        tone(700, 0.1, "triangle", 0.1, 0.05);
      }
      function sfxClick() {
        tone(880, 0.06, "square", 0.08);
      }
      function sfxCorrect() {
        tone(523, 0.12, "sine", 0.2);
        tone(659, 0.12, "sine", 0.2, 0.1);
        tone(784, 0.18, "sine", 0.22, 0.2);
      }
      function sfxIncorrect() {
        tone(220, 0.18, "sawtooth", 0.15);
        tone(180, 0.22, "sawtooth", 0.13, 0.12);
      }
      function sfxComplete() {
        [523, 659, 784, 1046].forEach((f, i) =>
          tone(f, 0.25, "sine", 0.2, i * 0.15),
        );
      }

      const cardEl = document.getElementById("card");
      const questionText = document.getElementById("questionText");
      const answerText = document.getElementById("answerText");
      const explainText = document.getElementById("explainText");
      const cardNumFront = document.getElementById("cardNumFront");
      const cardNumBack = document.getElementById("cardNumBack");
      const assessRow = document.getElementById("assessRow");
      const btnCorrect = document.getElementById("btnCorrect");
      const btnIncorrect = document.getElementById("btnIncorrect");
      const correctCountEl = document.getElementById("correctCount");
      const incorrectCountEl = document.getElementById("incorrectCount");
      const progressCountEl = document.getElementById("progressCount");
      const percentScoreEl = document.getElementById("percentScore");
      const progressBarFill = document.getElementById("progressBarFill");
      const stage = document.getElementById("stage");
      const resultsEl = document.getElementById("results");
      const finalPercent = document.getElementById("finalPercent");
      const finalMsg = document.getElementById("finalMsg");
      const finalCorrect = document.getElementById("finalCorrect");
      const finalIncorrect = document.getElementById("finalIncorrect");
      const restartBtn = document.getElementById("restartBtn");
      const soundToggle = document.getElementById("soundToggle");
      const shuffleBtn = document.getElementById("shuffleBtn");
      const prevBtn = document.getElementById("prevBtn");
      const skipBtn = document.getElementById("skipBtn");
      const tapHint = document.getElementById("tapHint");

      function loadCard() {
        answeredThisCard = false;
        cardEl.classList.remove("flipped");
        assessRow.classList.remove("show");
        tapHint.style.display = "block";
        const idx = deck[pos];
        const c = cards[idx];
        questionText.textContent = c.q;
        answerText.textContent = c.a;
        explainText.textContent = c.e;
        cardNumFront.textContent = `${pos + 1} / ${deck.length}`;
        cardNumBack.textContent = `${pos + 1} / ${deck.length}`;
        updateScoreboard();
        prevBtn.disabled = pos === 0;
      }

      function updateScoreboard() {
        correctCountEl.textContent = correctCount;
        incorrectCountEl.textContent = incorrectCount;
        progressCountEl.textContent = `${pos + 1}/${deck.length}`;
        const totalAnswered = correctCount + incorrectCount;
        const pct = totalAnswered
          ? Math.round((correctCount / totalAnswered) * 100)
          : 0;
        percentScoreEl.textContent = `${pct}%`;
        progressBarFill.style.width = `${(pos / deck.length) * 100}%`;
      }

      function flipCard() {
        sfxFlip();
        cardEl.classList.toggle("flipped");
        if (cardEl.classList.contains("flipped")) {
          tapHint.style.display = "none";
          assessRow.classList.add("show");
        } else {
          tapHint.style.display = "block";
          assessRow.classList.remove("show");
        }
      }

      cardEl.addEventListener("click", () => {
        flipCard();
      });

      function nextCard() {
        if (pos < deck.length - 1) {
          pos++;
          loadCard();
        } else {
          showResults();
        }
      }

      function markAnswer(isCorrect) {
        if (answeredThisCard) return;
        answeredThisCard = true;
        if (isCorrect) {
          correctCount++;
          sfxCorrect();
          burst("celebrate");
          cardEl.style.setProperty("--rot", "180deg");
          cardEl.classList.add("pop");
          setTimeout(() => cardEl.classList.remove("pop"), 500);
        } else {
          incorrectCount++;
          sfxIncorrect();
          cardEl.style.setProperty("--rot", "180deg");
          cardEl.classList.add("shake");
          setTimeout(() => cardEl.classList.remove("shake"), 500);
        }
        updateScoreboard();
        setTimeout(() => {
          nextCard();
        }, 700);
      }

      btnCorrect.addEventListener("click", (e) => {
        e.stopPropagation();
        markAnswer(true);
      });
      btnIncorrect.addEventListener("click", (e) => {
        e.stopPropagation();
        markAnswer(false);
      });

      prevBtn.addEventListener("click", () => {
        sfxClick();
        if (pos > 0) {
          pos--;
          loadCard();
        }
      });
      skipBtn.addEventListener("click", () => {
        sfxClick();
        nextCard();
      });

      soundToggle.addEventListener("click", () => {
        soundOn = !soundOn;
        soundToggle.textContent = soundOn ? "🔊" : "🔇";
        if (soundOn) {
          ensureAudio();
          tone(700, 0.08, "sine", 0.1);
        }
      });

      shuffleBtn.addEventListener("click", () => {
        sfxClick();
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        pos = 0;
        loadCard();
      });

      restartBtn.addEventListener("click", () => {
        sfxClick();
        deck = [...cards.keys()];
        pos = 0;
        correctCount = 0;
        incorrectCount = 0;
        resultsEl.style.display = "none";
        stage.style.display = "flex";
        document.querySelector(".tap-hint").style.display = "block";
        document.querySelector(".nav-row").style.display = "flex";
        document.querySelector(".score-board").style.display = "flex";
        document.querySelector(".progress-bar-wrap").style.display = "block";
        loadCard();
      });

      function showResults() {
        progressBarFill.style.width = "100%";
        stage.style.display = "none";
        tapHint.style.display = "none";
        assessRow.classList.remove("show");
        document.querySelector(".nav-row").style.display = "none";
        resultsEl.style.display = "flex";
        const total = correctCount + incorrectCount;
        const pct = total ? Math.round((correctCount / total) * 100) : 0;
        finalPercent.textContent = `${pct}%`;
        finalCorrect.textContent = correctCount;
        finalIncorrect.textContent = incorrectCount;
        let msg = "";
        if (pct === 100)
          msg = "Perfect score! You're a true dental materials master! 🦷💖";
        else if (pct >= 85)
          msg = "Amazing work! You really know your stuff! 🌸";
        else if (pct >= 70)
          msg = "Great job! Just a bit more review and you'll be golden! ✨";
        else if (pct >= 50)
          msg = "Nice effort! Keep reviewing — you're getting there! 🌷";
        else
          msg =
            "Good start! Review the deck again and watch your score grow! 💪";
        finalMsg.textContent = msg;
        sfxComplete();
        burst("confetti");
      }

      function burst(kind) {
        const emojisCelebrate = ["✨", "💖", "🌸", "⭐", "💕"];
        const emojisConfetti = ["🎉", "✨", "💗", "🌟", "🎊", "💖"];
        const list = kind === "celebrate" ? emojisCelebrate : emojisConfetti;
        const count = kind === "celebrate" ? 14 : 30;
        const rect = cardEl.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.className = "particle";
          el.textContent = list[Math.floor(Math.random() * list.length)];
          const startX =
            kind === "confetti" ? Math.random() * window.innerWidth : cx;
          const startY = kind === "confetti" ? -20 : cy;
          el.style.left = startX + "px";
          el.style.top = startY + "px";
          el.style.fontSize = 14 + Math.random() * 16 + "px";
          document.body.appendChild(el);
          const dx =
            kind === "confetti"
              ? (Math.random() - 0.5) * 200
              : (Math.random() - 0.5) * 260;
          const dy =
            kind === "confetti"
              ? window.innerHeight + 40
              : -(80 + Math.random() * 160);
          const rot = (Math.random() - 0.5) * 720;
          const dur =
            kind === "confetti"
              ? 1800 + Math.random() * 1200
              : 900 + Math.random() * 500;
          el.animate(
            [
              { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
              {
                transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg)`,
                opacity: 0,
              },
            ],
            { duration: dur, easing: "cubic-bezier(.2,.6,.3,1)" },
          );
          setTimeout(() => el.remove(), dur + 50);
        }
      }

      function spawnBgHearts() {
        const hearts = ["💗", "💕", "🩷", "💖"];
        for (let i = 0; i < 10; i++) {
          const el = document.createElement("div");
          el.className = "bg-heart";
          el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          el.style.left = Math.random() * 100 + "vw";
          el.style.animationDuration = 12 + Math.random() * 14 + "s";
          el.style.animationDelay = Math.random() * 10 + "s";
          el.style.fontSize = 14 + Math.random() * 14 + "px";
          document.body.appendChild(el);
        }
      }
      spawnBgHearts();

      document.addEventListener("keydown", (e) => {
        if (resultsEl.style.display === "flex") return;
        if (e.code === "Space") {
          e.preventDefault();
          flipCard();
        }
        if (e.key === "ArrowRight") {
          nextCard();
        }
        if (e.key === "ArrowLeft" && pos > 0) {
          pos--;
          loadCard();
        }
      });

      loadCard();
    </script>
  </body>
</html>
